  stroke: #9370DB;
  stroke-width: 1;
  stroke-dasharray: 6,3;
}
.subgraph-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-thick .edge-line {
  stroke-width: 3;
}
.edge-dotted .edge-line {
  stroke-dasharray: 5,5;
}
.edge-dotted-open .edge-line {
  stroke-dasharray: 5,5;
}
.arrowhead {
  fill: #333;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
