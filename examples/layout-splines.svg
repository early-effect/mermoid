}
.fragment-frame {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-tab {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.fragment-divider {
  stroke: #9370DB;
  stroke-width: 1;
  fill: none;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
