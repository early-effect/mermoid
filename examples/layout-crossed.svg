<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260">
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10.2" refX="12" refY="5.1" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="arrowhead" points="0 0, 12 5.1, 0 10.2"/>
    </marker>
  </defs>
  <style>
:root {
  --mermoid-background: #ffffff;
  --mermoid-edge-label-bg: #ffffff;
  --mermoid-font-family: sans-serif;
  --mermoid-font-size: 14px;
  --mermoid-line: #333;
  --mermoid-main-bkg: #ECECFF;
  --mermoid-node-border: #9370DB;
  --mermoid-note-bg: #ffffcc;
  --mermoid-note-border: #333333;
  --mermoid-note-text: #333333;
  --mermoid-primary: #1f77b4;
  --mermoid-primary-border: #1a5a8a;
  --mermoid-primary-text: #333;
  --mermoid-secondary: #ffffde;
  --mermoid-secondary-border: #aaaa33;
  --mermoid-secondary-text: #333;
  --mermoid-tertiary: #f4f4f4;
  --mermoid-tertiary-border: #cccccc;
  --mermoid-tertiary-text: #333;
  --mermoid-text: #333;
}
.diagram-bg {
  fill: #ffffff;
  stroke: none;
}
.node-shape {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.node-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-line {
  stroke: #333;
  stroke-width: 2;
}
.edge-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.edge-label-bg {
  fill: #ffffff;
}
.note-rect {
  fill: #ffffcc;
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.note-text {
  fill: #333333;
  font-family: sans-serif;
  font-size: 12px;
}
.note-connector {
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.subgraph-rect {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
  stroke-dasharray: 6,3;
}
.subgraph-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-thick .edge-line {
  stroke-width: 3;
}
.edge-dotted .edge-line {
  stroke-dasharray: 5,5;
}
.edge-dotted-open .edge-line {
  stroke-dasharray: 5,5;
}
.arrowhead {
  fill: #333;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
  <rect class="diagram-bg" x="0" y="0" width="320" height="260"/>
  <g class="edge edge-arrow" id="edge-A-D-0" data-from="A" data-to="D">
    <path class="edge-line" d="M80,90 L80,162" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g class="edge edge-arrow" id="edge-B-C-0" data-from="B" data-to="C">
    <path class="edge-line" d="M240,90 L240,162" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g class="node node-rect" id="node-A">
    <rect class="node-shape" x="40" y="40" width="80" height="50" rx="0" ry="0"/>
    <text class="node-label" x="80" y="65" text-anchor="middle" dominant-baseline="central">A</text>
  </g>
  <g class="node node-rect" id="node-B">
    <rect class="node-shape" x="200" y="40" width="80" height="50" rx="0" ry="0"/>
    <text class="node-label" x="240" y="65" text-anchor="middle" dominant-baseline="central">B</text>
  </g>
  <g class="node node-rect" id="node-D">
    <rect class="node-shape" x="40" y="170" width="80" height="50" rx="0" ry="0"/>
    <text class="node-label" x="80" y="195" text-anchor="middle" dominant-baseline="central">D</text>
  </g>
  <g class="node node-rect" id="node-C">
    <rect class="node-shape" x="200" y="170" width="80" height="50" rx="0" ry="0"/>
    <text class="node-label" x="240" y="195" text-anchor="middle" dominant-baseline="central">C</text>
  </g>
</svg>