<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="0 0 400 390">
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10.2" refX="12" refY="5.1" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="arrowhead" points="0 0, 12 5.1, 0 10.2"/>
    </marker>
  </defs>
  <style>
:root {
  --mermoid-background: #ffffff;
  --mermoid-edge-label-bg: #ffffff;
  --mermoid-font-family: sans-serif;
  --mermoid-font-size: 14px;
  --mermoid-line: #333;
  --mermoid-main-bkg: #ECECFF;
  --mermoid-node-border: #9370DB;
  --mermoid-note-bg: #ffffcc;
  --mermoid-note-border: #333333;
  --mermoid-note-text: #333333;
  --mermoid-primary: #1f77b4;
  --mermoid-primary-border: #1a5a8a;
  --mermoid-primary-text: #333;
  --mermoid-secondary: #ffffde;
  --mermoid-secondary-border: #aaaa33;
  --mermoid-secondary-text: #333;
  --mermoid-selection: #333;
  --mermoid-tertiary: #f4f4f4;
  --mermoid-tertiary-border: #cccccc;
  --mermoid-tertiary-text: #333;
  --mermoid-text: #333;
}
.diagram-bg {
  fill: #ffffff;
  stroke: none;
}
.node-shape {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.node-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-line {
  stroke: #333;
  stroke-width: 2;
}
.edge-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.edge-label-bg {
  fill: #ffffff;
}
.note-rect {
  fill: #ffffcc;
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.note-text {
  fill: #333333;
  font-family: sans-serif;
  font-size: 12px;
}
.note-connector {
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.subgraph-rect {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
  stroke-dasharray: 6,3;
}
.subgraph-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-thick .edge-line {
  stroke-width: 3;
}
.edge-dotted .edge-line {
  stroke-dasharray: 5,5;
}
.edge-dotted-open .edge-line {
  stroke-dasharray: 5,5;
}
.arrowhead {
  fill: #333;
}
.arrow-open {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.arrow-cross {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.actor-box {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.actor-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.actor-figure {
  fill: none;
  stroke: #9370DB;
  stroke-width: 2;
}
.lifeline {
  stroke: #333;
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 4,4;
}
.message-line {
  stroke: #333;
  stroke-width: 2;
  fill: none;
}
.message-dashed .message-line {
  stroke-dasharray: 6,4;
}
.message-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.activation {
  fill: #333;
  stroke: none;
  fill-opacity: 0.25;
}
.fragment-frame {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-tab {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.fragment-divider {
  stroke: #9370DB;
  stroke-width: 1;
  fill: none;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
