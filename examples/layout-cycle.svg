    <text class="node-label" x="320" y="195" text-anchor="middle" dominant-baseline="central">D</text>
  </g>
  <g class="node node-rect" id="node-C">
    <rect class="node-shape" x="160" y="300" width="80" height="50" rx="0" ry="0"/>
    <text class="node-label" x="200" y="325" text-anchor="middle" dominant-baseline="central">C</text>
  </g>
