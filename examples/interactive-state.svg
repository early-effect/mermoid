<svg xmlns="http://www.w3.org/2000/svg" width="350" height="678" viewBox="0 0 350 678">
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10.2" refX="12" refY="5.1" orient="auto" markerUnits="userSpaceOnUse">
      <polygon class="arrowhead" points="0 0, 12 5.1, 0 10.2"/>
    </marker>
  </defs>
  <style>
:root {
  --mermoid-background: #ffffff;
  --mermoid-edge-label-bg: #ffffff;
  --mermoid-font-family: sans-serif;
  --mermoid-font-size: 14px;
  --mermoid-line: #333;
  --mermoid-main-bkg: #ECECFF;
  --mermoid-node-border: #9370DB;
  --mermoid-note-bg: #ffffcc;
  --mermoid-note-border: #333333;
  --mermoid-note-text: #333333;
  --mermoid-primary: #1f77b4;
  --mermoid-primary-border: #1a5a8a;
  --mermoid-primary-text: #333;
  --mermoid-secondary: #ffffde;
  --mermoid-secondary-border: #aaaa33;
  --mermoid-secondary-text: #333;
  --mermoid-selection: #333;
  --mermoid-tertiary: #f4f4f4;
  --mermoid-tertiary-border: #cccccc;
  --mermoid-tertiary-text: #333;
  --mermoid-text: #333;
}
.diagram-bg {
  fill: #ffffff;
  stroke: none;
}
.node-shape {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.node-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-line {
  stroke: #333;
  stroke-width: 2;
}
.edge-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.edge-label-bg {
  fill: #ffffff;
}
.note-rect {
  fill: #ffffcc;
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.note-text {
  fill: #333333;
  font-family: sans-serif;
  font-size: 12px;
}
.note-connector {
  stroke: #333333;
  stroke-width: 1;
  stroke-dasharray: 4,2;
}
.subgraph-rect {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
  stroke-dasharray: 6,3;
}
.subgraph-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.edge-thick .edge-line {
  stroke-width: 3;
}
.edge-dotted .edge-line {
  stroke-dasharray: 5,5;
}
.edge-dotted-open .edge-line {
  stroke-dasharray: 5,5;
}
.arrowhead {
  fill: #333;
}
.arrow-open {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.arrow-cross {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.actor-box {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.actor-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.actor-figure {
  fill: none;
  stroke: #9370DB;
  stroke-width: 2;
}
.lifeline {
  stroke: #333;
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 4,4;
}
.message-line {
  stroke: #333;
  stroke-width: 2;
  fill: none;
}
.message-dashed .message-line {
  stroke-dasharray: 6,4;
}
.message-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.activation {
  fill: #333;
  stroke: none;
  fill-opacity: 0.25;
}
.fragment-frame {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-tab {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.fragment-divider {
  stroke: #9370DB;
  stroke-width: 1;
  fill: none;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
  <rect class="diagram-bg" x="0" y="0" width="350" height="678"/>
  <g class="edge edge-arrow" id="edge-[*]-Idle-0" data-from="[*]" data-to="Idle">
    <path class="edge-line" d="M89.5,88 L89.5,192" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g class="edge edge-arrow" id="edge-Idle-Active-0" data-from="Idle" data-to="Active">
    <path class="edge-line" d="M89.5,250 L89.5,322" fill="none" marker-end="url(#arrowhead)"/>
    <rect class="edge-label-bg" x="67.5" y="276" width="44" height="20" rx="3" ry="3"/>
    <text class="edge-label" x="89.5" y="286" text-anchor="middle" dominant-baseline="central" style="font-size: 12px">start</text>
  </g>
  <g class="edge edge-arrow" id="edge-Active-Idle-0" data-from="Active" data-to="Idle">
    <path class="edge-line" d="M89.5,330 L89.5,258" fill="none" marker-end="url(#arrowhead)"/>
    <rect class="edge-label-bg" x="67.5" y="284" width="44" height="20" rx="3" ry="3"/>
    <text class="edge-label" x="89.5" y="294" text-anchor="middle" dominant-baseline="central" style="font-size: 12px">pause</text>
  </g>
  <g class="edge edge-arrow" id="edge-Active-Done-0" data-from="Active" data-to="Done">
    <path class="edge-line" d="M89.5,380 L89.5,452" fill="none" marker-end="url(#arrowhead)"/>
    <rect class="edge-label-bg" x="63.900000000000006" y="406" width="51.199999999999996" height="20" rx="3" ry="3"/>
    <text class="edge-label" x="89.5" y="416" text-anchor="middle" dominant-baseline="central" style="font-size: 12px">finish</text>
  </g>
  <g class="edge edge-arrow" id="edge-Done-[*]-end-0" data-from="Done" data-to="[*]-end">
    <path class="edge-line" d="M89.5,510 L89.5,614" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g class="node node-circle start-end" id="node-[*]">
    <circle class="node-shape" cx="89.5" cy="80" r="8"/>
  </g>
  <g class="node node-round" id="node-Idle">
    <rect class="node-shape" x="48.5" y="200" width="82" height="50" rx="15" ry="15"/>
    <text class="node-label" x="89.5" y="225" text-anchor="middle" dominant-baseline="central">Idle</text>
  </g>
  <g class="node node-round" id="node-Active">
    <rect class="node-shape" x="40" y="330" width="99" height="50" rx="15" ry="15"/>
    <text class="node-label" x="89.5" y="355" text-anchor="middle" dominant-baseline="central">Active</text>
  </g>
  <g class="node node-round" id="node-Done">
    <rect class="node-shape" x="48.5" y="460" width="82" height="50" rx="15" ry="15"/>
    <text class="node-label" x="89.5" y="485" text-anchor="middle" dominant-baseline="central">Done</text>
  </g>
  <g class="node node-circle start-end state-end" id="node-[*]-end">
    <circle class="node-shape" cx="89.5" cy="630" r="8" fill="none"/>
    <circle class="node-shape" cx="89.5" cy="630" r="3.6"/>
  </g>
  <g class="note" id="note-Idle-0">
    <line class="note-connector" x1="130.5" y1="225" x2="145.5" y2="225"/>
    <rect class="note-rect" x="145.5" y="211" width="164.5" height="28" rx="3" ry="3"/>
    <text class="note-text" x="155.5" y="229" text-anchor="start" dominant-baseline="central">Waiting for input</text>
  </g>
</svg>