  </g>
  <g class="edge edge-open" id="edge-Customer-Invoice-0" data-from="Customer" data-to="Invoice">
    <path class="edge-line" d="M156,160.5889781859931 Q211.10296211251435,156.6313203214696 262,178.11366245694603" fill="none" marker-end="url(#mark-arrow)"/>
    <rect class="edge-label-bg" x="176.2" y="159.3513203214696" width="65.6" height="20" rx="3" ry="3"/>
    <text class="edge-label" x="209" y="169.3513203214696" text-anchor="middle" dominant-baseline="central" style="font-size: 12px">receives</text>
  </g>
  <g class="edge edge-open" id="edge-Invoice-Payment-0" data-from="Invoice" data-to="Payment">
    <path class="edge-line" d="M369.5,187 L478.5,187" fill="none" marker-end="url(#mark-arrow)"/>
    <rect class="edge-label-bg" x="384" y="177" width="80" height="20" rx="3" ry="3"/>
    <text class="edge-label" x="424" y="187" text-anchor="middle" dominant-baseline="central" style="font-size: 12px">settled by</text>
  </g>
  <g class="node node-rect" id="node-Customer">
    <rect class="node-shape" x="40" y="108" width="116" height="86" rx="4"/>
    <line class="node-shape" x1="40" y1="134" x2="156" y2="134"/>
    <line class="node-shape" x1="40" y1="160" x2="156" y2="160"/>
    <text class="node-label" x="98" y="121" text-anchor="middle" dominant-baseline="central">Customer</text>
  </g>
  <g class="node node-rect" id="node-Invoice">
    <rect class="node-shape" x="262" y="144" width="107.5" height="86" rx="4"/>
    <line class="node-shape" x1="262" y1="170" x2="369.5" y2="170"/>
    <line class="node-shape" x1="262" y1="196" x2="369.5" y2="196"/>
    <text class="node-label" x="315.75" y="157" text-anchor="middle" dominant-baseline="central">Invoice</text>
  </g>
  <g class="node node-rect" id="node-Payment">
    <rect class="node-shape" x="478.5" y="144" width="107.5" height="86" rx="4"/>
    <line class="node-shape" x1="478.5" y1="170" x2="586" y2="170"/>
    <line class="node-shape" x1="478.5" y1="196" x2="586" y2="196"/>
    <text class="node-label" x="532.25" y="157" text-anchor="middle" dominant-baseline="central">Payment</text>
  </g>
</svg>