  font-family: sans-serif;
  font-size: 14px;
}
.edge-thick .edge-line {
  stroke-width: 3;
}
.edge-dotted .edge-line {
  stroke-dasharray: 5,5;
}
.edge-dotted-open .edge-line {
  stroke-dasharray: 5,5;
}
.arrowhead {
  fill: #333;
}
.arrow-open {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.arrow-cross {
  fill: none;
  stroke: #333;
  stroke-width: 2;
}
.actor-box {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 2;
}
.actor-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 14px;
}
.actor-figure {
  fill: none;
  stroke: #9370DB;
  stroke-width: 2;
}
.lifeline {
  stroke: #333;
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 4,4;
}
.message-line {
  stroke: #333;
  stroke-width: 2;
  fill: none;
}
.message-dashed .message-line {
  stroke-dasharray: 6,4;
}
.message-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.activation {
  fill: #333;
  stroke: none;
  fill-opacity: 0.25;
}
.fragment-frame {
  fill: none;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-tab {
  fill: #ECECFF;
  stroke: #9370DB;
  stroke-width: 1;
}
.fragment-label {
  fill: #333;
  font-family: sans-serif;
  font-size: 12px;
}
.fragment-divider {
  stroke: #9370DB;
  stroke-width: 1;
  fill: none;
}
.start-end .node-shape {
  fill: #333;
  stroke: #333;
}
</style>
